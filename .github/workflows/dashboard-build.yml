name: Dashboard Build PR

on:
  push:
    branches: [ develop ]

defaults:
  run:
    working-directory: dashboard/src

jobs:
  build_dashboard:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: 18
      - name: Compile Dashboard
        run: |
            # NB: We are in directory dashboard/src
            # BUILD_PATH is set in package.json to compile directly into src/orion/dashboard/build
            yarn
            DEST=../../src/orion/dashboard/build
            # If previous build folder exists and is same as new one, do not update.
            # In any other case, we must update.
            OLD_BUILD_EXISTS=0; [ -d "${DEST}" ] && OLD_BUILD_EXISTS=1
            # Temporarily rename old build to compare after
            if [ "${OLD_BUILD_EXISTS}" = "1" ]; then mv "${DEST}" "${DEST}.old"; fi
            yarn build
            if ( [ "${OLD_BUILD_EXISTS}" = "1" ] && diff -qr "${DEST}" "${DEST}.old" ); then UPDATE_BUILD=0; else UPDATE_BUILD=1; fi
            rm -rf "${DEST}.old"
            echo "update_build=${UPDATE_BUILD}" >> $GITHUB_ENV
            echo Build changes ? ${UPDATE_BUILD}
      - name: Create Pull Request
        if: ${{ env.update_build == '1' }}
        id: cpr
        uses: peter-evans/create-pull-request@v3
        with:
          commit-message: 'Compile Dashboard'
          branch: ci/build-dashboard
          base: develop
          delete-branch: true
          title: 'Compile Dashboard'
          body: |
            Auto-generated by [create-pull-request][1]

            [1]: https://github.com/peter-evans/create-pull-request
          labels: |
            automated pr
      - name: Check outputs
        if: ${{ env.update_build == '1' }}
        run: |
          echo "Pull Request Number - ${{ steps.cpr.outputs.pull-request-number }}"
          echo "Pull Request URL - ${{ steps.cpr.outputs.pull-request-url }}"
