[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orion.algo.gradient_descent"
version = "0.1"
description = "Implement a gradient descent algorithm, for demo and testing."
license = "BSD-3-Clause"
requires-python = ">=3.10"
authors = [
    { name = "Christos Tsirigotis", email = "tsirif@gmail.com" },
]
keywords = ["Machine Learning", "Deep Learning", "Distributed", "Optimization"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["orion"]

[project.urls]
Homepage = "https://github.com/epistimio/orion"

[project.entry-points.BaseAlgorithm]
gradient_descent = "orion.algo.gradient_descent:Gradient_Descent"

[tool.hatch.build.targets.wheel]
packages = ["src/orion"]
