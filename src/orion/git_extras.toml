# Extra dependencies that require git URLs (not publishable on PyPI).
# Installed via `orion install <extra>`. Same PEP 508 syntax as pyproject.toml.
#
# Why this file exists:
# PyPI rejects uploads whose metadata contain direct references (PEP 440),
# even in optional extras. Before hatchling, this went unnoticed because
# setuptools had a bug that omitted Requires-Dist from sdist PKG-INFO
# (fixed in setuptools v68.2.0, Aug 2023). No modern build backend can
# work around this — the restriction is enforced by PyPI at upload time.
#
# Migration path: when a package listed here gets published on PyPI,
# move its extra from this file into pyproject.toml [project.optional-dependencies].
# The `orion install` command and ImportOptional.ensure() adapt automatically.

[dehb]
dependencies = [
    'ConfigSpace>=0.7,<1; python_version < "3.12"',
    'dehb @ git+https://github.com/bouthilx/DEHB.git@master ; python_version < "3.12"',
    'sspace @ git+https://github.com/Epistimio/sample-space.git@master ; python_version < "3.12"',
]

[bohb]
dependencies = [
    'hpbandster; python_version < "3.12"',
    'ConfigSpace>=0.7,<1; python_version < "3.12"',
    'sspace @ git+https://github.com/Epistimio/sample-space.git@master ; python_version < "3.12"',
]

[hebo]
dependencies = [
    'pymoo==0.6.0; python_version < "3.12"',
    'hebo @ git+https://github.com/huawei-noah/HEBO.git@v0.3.6#subdirectory=HEBO ; python_version < "3.12"',
]

[track]
dependencies = [
    "track @ git+https://github.com/Delaunay/track@master",
]
